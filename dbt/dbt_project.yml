name: traffic_accidents
version: "1.0.0"
config-version: 2
profile: traffic_accidents

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]

# Base de datos final = {ENTORNO}_{CAPA}_DB (ver macros/generate_database_name.sql),
# esquema siempre TRAFFIC_ACCIDENTS. Ej.: DEV_SILVER_DB.TRAFFIC_ACCIDENTS.ACCIDENT
# Materialización por capa, cambiable con variables de entorno sin tocar código:
#   DBT_MAT_BRONZE, DBT_MAT_SILVER, DBT_MAT_GOLD  (table | view)
models:
  traffic_accidents:
    "1_bronze":
      +database: bronze
      +materialized: "{{ env_var('DBT_MAT_BRONZE', 'view') }}"
    "2_silver":
      +database: silver
      +materialized: "{{ env_var('DBT_MAT_SILVER', 'table') }}"
    "3_gold":
      +database: gold
      +materialized: "{{ env_var('DBT_MAT_GOLD', 'table') }}"
